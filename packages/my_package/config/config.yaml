ros:
  vehicle_name: "bear"

map:
  width: 1.5
  height: 1.5
  resolution: 0.05

start:
  x: 0.15
  y: 0.15
  theta: 0.0

goal:
  x: 1.35
  y: 1.35

obstacle:
  x: 0.75
  y: 0.75
  radius: 0.08

robot:
  radius: 0.10
  safety_margin: 0.05
  sensing_radius: 0.45

  # Duckiebot approximate wheel distance.
  wheel_base: 0.10

  # Converts linear wheel velocity estimate to Duckiebot wheel command.
  # If robot is too slow, increase this.
  # If robot is too aggressive, decrease this.
  wheel_cmd_gain: 3.0

  # Duckietown wheel commands are usually normalized.
  max_wheel_cmd: 0.45

dwa:
  min_v: 0.00
  max_v: 0.18

  min_w: -2.0
  max_w: 2.0

  max_accel_v: 0.30
  max_accel_w: 4.0

  v_samples: 8
  w_samples: 21

  dt: 0.1
  horizon: 1.6

cost:
  path_weight: 1.0
  goal_weight: 1.7
  obstacle_weight: 2.8
  heading_weight: 0.4

control:
  loop_rate: 10
  goal_tolerance: 0.08

visualization:
  enabled: true

simulation:
  # true: node updates robot pose internally.
  # This is useful for assignment demo / matplotlib simulation.
  # If you later use real localization, set this false and subscribe to pose instead.
  use_internal_pose: true

bonus:
  # false: uses known obstacle from YAML.
  # true: estimates obstacle from front ToF sensor at runtime.
  unknown_obstacle: false